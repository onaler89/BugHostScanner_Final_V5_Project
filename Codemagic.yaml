workflows:
  android-debug:
    name: Bug Host Scanner APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Extract project ZIP
        script: |
          mkdir project
          unzip -q BugHostScanner_Codemagic_Ready.zip -d project
          cd project
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build APK
        script: |
          cd project
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug
    artifacts:
      - project/app/build/outputs/apk/debug/*.apk
