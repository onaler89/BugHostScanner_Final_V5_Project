
workflows:
  android-debug:
    name: Bug Host Scanner APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    scripts:
      - name: Extract project ZIP
        script: |
          mkdir -p project
          unzip -o BugHostScanner_Codemagic_Ready.zip -d project

      - name: Find Gradle project
        script: |
          SETTINGS=$(find project -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts tidak ditemukan"
            find project -maxdepth 4 -type f
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Project ditemukan: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"

      - name: Build APK
        script: |
          cd "$PROJECT_DIR"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug

    artifacts:
      - project/**/build/outputs/apk/debug/*.apk
