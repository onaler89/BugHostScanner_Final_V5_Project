scripts:
  - name: Find and extract V5 ZIP
    script: |
      set -e

      echo "Mencari file ZIP V5..."

      ZIP_FILE=$(find . -type f \
        -name "BugHostScanner_Codemagic_Ready-2.zip" \
        -print -quit)

      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: ZIP V5 tidak ditemukan!"
        echo "Daftar file ZIP:"
        find . -type f -name "*.zip"
        exit 1
      fi

      echo "ZIP ditemukan: $ZIP_FILE"

      mkdir -p project
      unzip -o "$ZIP_FILE" -d project

      echo "Ekstraksi selesai."
